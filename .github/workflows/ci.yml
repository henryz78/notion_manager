name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Verify embedded frontend is current
        run: |
          rm -rf internal/web/dist
          cp -R web/dist internal/web/dist
          # Vite leaves one harmless blank line in index.html on Windows but
          # not on Linux. Ignore line-ending/blank-line noise while still
          # catching changed asset hashes or compiled JS/CSS.
          git diff --ignore-space-at-eol --ignore-blank-lines --exit-code -- internal/web/dist

      - name: Check formatting of changed Go files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD^"
          fi
          files="$(git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '*.go')"
          if [ -z "$files" ]; then
            exit 0
          fi
          unformatted="$(printf '%s\n' "$files" | xargs -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Run proxy race tests
        run: go test -race ./internal/proxy

      - name: Run Go vet
        run: go vet ./...
